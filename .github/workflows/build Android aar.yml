name: Build Android AAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 支持手动触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 配置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # 3. 配置 Android NDK
    - name: Set up NDK
      uses: nbdime/setup-ndk@v1
      with:
        ndk-version: r25b

    # 4. 安装 gomobile 并执行编译
    - name: Install gomobile and Build AAR
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        gomobile bind -v -target=android/arm64 -androidapi 21 -o libgopeed.aar ./bind

    # 5. 上传生成的产物 (Artifacts) 供下载
    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libgopeed-aar
        path: libgopeed.aar
