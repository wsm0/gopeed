name: Build libgopeed.aar (arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Gopeed 的分支 / tag / commit"
        default: "main"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gopeed
        uses: actions/checkout@v4
        with:
          repository: GopeedLab/gopeed
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls $ANDROID_HOME/ndk

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Build aar
        run: |
          go get golang.org/x/mobile/bind
          mkdir -p dist
          cd bind/mobile
          gomobile bind \
            -tags nosqlite \
            -ldflags="-w -s -checklinkname=0" \
            -target=android/arm64 \
            -androidapi 21 \
            -o ${{ github.workspace }}/dist/libgopeed.aar \
            github.com/GopeedLab/gopeed/bind/mobile

      - name: Verify
        run: unzip -l dist/libgopeed.aar | grep jni

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgopeed-arm64-v8a
          path: dist/libgopeed.aar
