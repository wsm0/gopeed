name: Build Android AAR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Go 环境
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # 适配最新的 Go 依赖处理方式

      # 3. 配置 Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 安装 NDK
      - name: Install NDK via Preinstalled SDK Manager
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # 5. 安装 gomobile、添加 -tool 依赖并编译
      - name: Install gomobile and Build AAR
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get -tool golang.org/x/mobile/cmd/gobind
          go get golang.org/x/mobile
          go mod tidy
          gomobile init
          gomobile bind -v -target=android/arm64 -androidapi 21 -o libgopeed.aar ./bind

      # 6. 上传编译产物
      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgopeed-aar
          path: libgopeed.aar
